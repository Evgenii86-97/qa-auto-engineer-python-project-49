[project]
name = "hexlet-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Evgenii86-97", email = "aea1997mail.ru" }
]
requires-python = ">=3.15"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
qa-auto-engineer-python-project-49 = "qa_auto_engineer_python_project_49:main"
brain-games = "brain_games.scripts.brain_games:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brain_games"
module-root = "src"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
preview = true
select = ["E", "F", "I", "C90", "UP", "B", "S", "FURB", "RUF"]

[lint.per-file-ignores]
# В init-модулях допустимы неиспользуемые импорты
"__init__.py" = ["unused-import"]
# assert в тестах это норма pytest
"tests/**" = ["assert"]



